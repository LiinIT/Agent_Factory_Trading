# Chạy cả hệ thống (PostgreSQL + project_server + project_web) trên một máy:
#   cp .env.example .env   rồi   docker compose up --build -d --wait
# Cổng chỉ mở cho 127.0.0.1; lên server thật đặt Nginx + HTTPS phía trước (mẫu: project_server/deploy/nginx.conf).
# project_app (Flutter) không chạy trong Docker — trỏ API_BASE_URL tới server (xem project_app/README.md).
name: ${COMPOSE_PROJECT_NAME:-project}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  migrate:
    build: ./project_server
    command: ["/app/bin/migrate"]
    environment: &server-env
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app}
      DB_SSL_MODE: disable
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Đặt JWT_ACCESS_SECRET (≥ 32 ký tự) trong .env}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
    depends_on:
      db:
        condition: service_healthy

  server:
    build: ./project_server
    restart: unless-stopped
    environment:
      <<: *server-env
      PORT: 8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"

  web:
    build: ./project_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVER_URL: http://server:8080
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"

volumes:
  db-data:
